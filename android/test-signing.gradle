// Applied only by the manually dispatched, main-branch test-signing workflow.
gradle.beforeProject { app ->
  app.pluginManager.withPlugin('com.android.application') {
    def android = app.extensions.getByName('android')
    def keyPath = System.getenv('GEEK_TEST_KEYSTORE_PATH')
    def password = System.getenv('ANDROID_TEST_KEYSTORE_PASSWORD')
    if (!keyPath || !password) throw new GradleException('Test signing secrets are required')
    android.signingConfigs.create('geekStableTest') {
        storeFile new File(keyPath)
        storePassword password
        keyAlias 'geek-test'
        keyPassword password
    }
    android.buildTypes.debug.signingConfig = android.signingConfigs.geekStableTest
}
}
