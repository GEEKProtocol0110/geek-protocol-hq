name: Apply audit-readiness release

on:
  push:
    branches:
      - audit-readiness-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified release
        shell: bash
        run: |
          base64 -d audit-readiness.b64.txt | gzip -d > /tmp/audit-readiness.patch
          git config user.name "Geek Protocol Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git am /tmp/audit-readiness.patch
          git rm audit-readiness.b64.txt
          git commit -m "Remove one-time audit release payload"
          git push origin HEAD:audit-readiness-v1
