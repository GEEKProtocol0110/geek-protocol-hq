name: Apply CCE Alpha

on:
  push:
    branches:
      - cce-alpha

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested CCE release
        run: |
          printf '%s' '' | base64 -d > /tmp/cce-alpha.patch
          git config user.name 'Geek Protocol Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git am /tmp/cce-alpha.patch
          npm test
          git push origin HEAD:cce-alpha
