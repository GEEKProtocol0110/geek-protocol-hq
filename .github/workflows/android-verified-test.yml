name: Stable signed Android test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --prefix android --no-audit --no-fund
      - run: npm run generate --prefix android
      - name: Restore private test keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; if(!process.env.KEYSTORE)throw Error("Missing ANDROID_TEST_KEYSTORE_BASE64");fs.writeFileSync(process.env.RUNNER_TEMP+"/geek-test.jks",Buffer.from(process.env.KEYSTORE,"base64"),{mode:0o600});'
      - name: Build with stable test identity
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GEEK_TEST_KEYSTORE_PATH="$RUNNER_TEMP/geek-test.jks"
          cd android/generated
          ./gradlew --no-daemon --init-script ../test-signing.gradle assembleDebug
      - name: Produce public website association
        run: |
          APK=android/generated/app/build/outputs/apk/debug/app-debug.apk
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APK_SIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certificate.txt"
          FP=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2}' "$RUNNER_TEMP/certificate.txt" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')
          node android/association.mjs "$FP"
      - name: Delete private build material
        if: always()
        run: rm -f "$RUNNER_TEMP/geek-test.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geek-stable-test-and-public-association
          path: |
            android/generated/app/build/outputs/apk/debug/app-debug.apk
            public-association/assetlinks.json
          if-no-files-found: error
          retention-days: 14
