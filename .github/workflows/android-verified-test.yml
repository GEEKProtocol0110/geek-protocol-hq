name: Stable signed Android test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix android --ignore-scripts --no-audit --no-fund
      - run: npm run generate --prefix android
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build non-debuggable unsigned test APK without secrets
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android/generated
          ./gradlew --no-daemon --init-script ../unsigned-test.gradle assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geek-unsigned-stable-test
          path: android/generated/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
  signed-test:
    needs: unsigned-test
    if: github.ref == 'refs/heads/main'
    # Owner must configure this environment: main only, required reviewer,
    # and environment secrets. Never use repository-wide signing secrets.
    environment: android-test-signing
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download only this run's unsigned APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" -n geek-unsigned-stable-test -D unsigned
      - name: Check package and non-debuggable manifest before signing
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging unsigned/app-release-unsigned.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "^package: name='xyz.geekprotocol.app.test' " "$RUNNER_TEMP/apk-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo 'Stable test APK must not be debuggable'; exit 1
          fi
      - name: Sign and verify with the protected dedicated test key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/geek-test.jks"' EXIT
          node --input-type=module -e 'import fs from "node:fs";if(!process.env.KEYSTORE||!process.env.ANDROID_TEST_KEYSTORE_PASSWORD)throw Error("Dedicated environment signing secrets are required");fs.writeFileSync(process.env.RUNNER_TEMP+"/geek-test.jks",Buffer.from(process.env.KEYSTORE,"base64"),{mode:0o600});'
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          mkdir -p signed
          "$APK_SIGNER" sign --ks "$RUNNER_TEMP/geek-test.jks" --ks-key-alias geek-test --ks-pass env:ANDROID_TEST_KEYSTORE_PASSWORD --key-pass env:ANDROID_TEST_KEYSTORE_PASSWORD --out signed/geek-stable-test.apk unsigned/app-release-unsigned.apk
          "$APK_SIGNER" verify --print-certs signed/geek-stable-test.apk > "$RUNNER_TEMP/certificate.txt"
          FP=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2}' "$RUNNER_TEMP/certificate.txt" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')
          export GEEK_PUBLIC_TEST_FINGERPRINT="$FP"
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const fp=process.env.GEEK_PUBLIC_TEST_FINGERPRINT;
          if(!/^([0-9A-F]{2}:){31}[0-9A-F]{2}$/.test(fp||''))throw Error('Invalid public APK fingerprint');
          writeFileSync('signed/assetlinks.json',JSON.stringify([{relation:['delegate_permission/common.handle_all_urls'],target:{namespace:'android_app',package_name:'xyz.geekprotocol.app.test',sha256_cert_fingerprints:[fp]}}],null,2)+'\n');
          JS
      - name: Delete private build material even on failure
        if: always()
        run: rm -f "$RUNNER_TEMP/geek-test.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geek-stable-test-and-public-association
          path: |
            signed/geek-stable-test.apk
            signed/assetlinks.json
          if-no-files-found: error
          retention-days: 14
