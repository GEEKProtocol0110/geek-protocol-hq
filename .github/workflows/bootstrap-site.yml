name: Bootstrap Geek Protocol HQ

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the verified Geek Protocol HQ Site
        shell: bash
        run: |
          set -euo pipefail

          stage_dir="$(mktemp -d)"
          git clone --depth 1 https://github.com/GEEKProtocol0110/geek-protocol-alpha.git "$stage_dir/source"
          test -f "$stage_dir/source/apps/site-prototype/index.html"
          test "$(find "$stage_dir/source/apps/site-prototype" -type f | wc -l)" -eq 28

          git rm -rf .
          mkdir -p public
          cp -a "$stage_dir/source/apps/site-prototype/." public/
          cp "$stage_dir/source/LICENSE" LICENSE

          printf '.vercel/\n.DS_Store\n*.log\n' > .gitignore

          cat > README.md <<'README'
          # Geek Protocol HQ

          The official Geek Protocol experience for Kaspa: a static, browser-based trivia game and community hub.

          ## Included

          - Geek Protocol landing page
          - Ten-round playable Gauntlet
          - Eight selectable trivia categories
          - Lobby, mint-readiness, and Kaspa information pages
          - Complete question banks, artwork, styles, and scripts

          ## Run locally

          Serve the `public` directory with any static HTTP server.

          ## Deployment

          Vercel deploys `public` directly. No install or build command is required.

          ## Transparent Alpha

          Alpha balances, XP, lobby state, and progress are stored locally in the browser. Wallet connection, minting, and on-chain rewards are not enabled in this static release.
          README

          cat > vercel.json <<'VERCEL'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "installCommand": "",
            "buildCommand": null,
            "outputDirectory": "public",
            "cleanUrls": true,
            "trailingSlash": true,
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {
                    "key": "X-Content-Type-Options",
                    "value": "nosniff"
                  },
                  {
                    "key": "Referrer-Policy",
                    "value": "strict-origin-when-cross-origin"
                  },
                  {
                    "key": "Permissions-Policy",
                    "value": "camera=(), microphone=(), geolocation=()"
                  }
                ]
              }
            ]
          }
          VERCEL

          git add -A
          git config user.name "Geek Protocol Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish Geek Protocol HQ Site"
          git push origin main
