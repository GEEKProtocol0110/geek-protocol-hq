name: Apply hardened server build
on:
  push:
    branches: [server-alpha]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply hardened server-authoritative build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server-alpha
      - name: Apply verified build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p api server server/questions public/lobby/assets public/play/assets tests
          printf '%s' 'VVBTVEFTSF9SRURJU19SRVNUX1VSTD0KVVBTVEFTSF9SRURJU19SRVNUX1RPS0VOPQo=' | base64 -d > '.env.example'
          printf '%s' '' | base64 -d > 'README.md'
          printf '%s' 'ewogICJuYW1lIjogImdlZWstcHJvdG9jb2wtaHEiLAogICJwcml2YXRlIjogdHJ1ZSwKICAidHlwZSI6ICJtb2R1bGUiLAogICJzY3JpcHRzIjogewogICAgInRlc3QiOiAibm9kZSAtLXRlc3QiCiAgfSwKICAiZW5naW5lcyI6IHsKICAgICJub2RlIjogIj49MjAiCiAgfQp9Cg==' | base64 -d > 'package.json'
          printf '%s' '' | base64 -d > 'vercel.json'
          printf '%s' '' | base64 -d > 'api/health.js'
          printf '%s' '' | base64 -d > 'api/leaderboard.js'
          printf '%s' '' | base64 -d > 'api/lobbies.js'
          printf '%s' '' | base64 -d > 'api/ranked.js'
          printf '%s' '' | base64 -d > 'api/session.js'
          printf '%s' '' | base64 -d > 'server/http.js'
          printf '%s' '' | base64 -d > 'server/leaderboard.js'
          printf '%s' '' | base64 -d > 'server/profile.js'
          printf '%s' '' | base64 -d > 'server/questions.js'
          printf '%s' '' | base64 -d > 'server/redis.js'
          printf '%s' '' | base64 -d > 'server/session.js'
          printf '%s' '' | base64 -d > 'public/lobby/index.html'
          printf '%s' '' | base64 -d > 'public/lobby/assets/lobby.js'
          printf '%s' '' | base64 -d > 'public/lobby/assets/lobby.css'
          printf '%s' '' | base64 -d > 'public/play/index.html'
          printf '%s' '' | base64 -d > 'public/play/assets/game.js'
          printf '%s' '' | base64 -d > 'public/play/assets/game.css'
          printf '%s' '' | base64 -d > 'tests/api.test.js'
          for f in comics-questions.json history-questions.json kaspa-current-questions.json kaspa-questions.json movies-questions.json pop-culture-questions.json science-fiction-questions.json technology-questions.json video-games-questions.json; do
            git mv "public/play/assets/$f" "server/questions/$f"
          done
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply hardened server-authoritative build"
          git push origin HEAD:server-alpha
