name: Apply verified HQ upgrade

on:
  push:
    branches:
      - hq-wallet-modes-docs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified upgrade
        shell: bash
        run: |
          base64 -d hq-upgrade.b64.txt | gzip -d > /tmp/hq-upgrade.patch
          git config user.name "Geek Protocol Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git am /tmp/hq-upgrade.patch
          git rm hq-upgrade.b64.txt
          git commit -m "Remove one-time HQ release payload"
          git push origin HEAD:hq-wallet-modes-docs
